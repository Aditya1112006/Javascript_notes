<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon says game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon says game</h1>

    <h3>Press any key to start the game</h3>
    <div class="box-container">
        <div class="lin_one">
            <div class="div brown" type="button"></div>
            <div class="div orange" type="button"></div>
        </div>
        <div class="line-two">
            <div class="div red" type="button"></div>
            <div class="div blue" type="button"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
